# TACMUX opinionated tmux defaults. The integration fragment contains every
# TACMUX-specific binding and hook so it can also be sourced independently.

set-option -g default-shell /bin/zsh
set-option -g default-terminal "tmux-256color"
set-option -g prefix C-space
set-option -g mouse on
set-option -g history-limit 50000
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi

# Only explicit tmux copy operations may update the terminal clipboard.
set-option -s set-clipboard external

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set-option -g status-justify "absolute-centre"
set-option -g status-format[1] ""

unbind-key r
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded"

bind-key x split-window -v
bind-key y split-window -h
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

unbind-key W
bind-key W command-prompt -p "Window name:" "new-window -n '%%'"
bind-key t command-prompt -p "New name:" "rename-window '%%'"
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

set-option -g pane-border-status top
set-option -g pane-border-format " #{?#{@pinned_title},#{?#{e|>:#{pane_width},60},#{=30:#{@pinned_title}},#{=15:#{@pinned_title}}},#{?#{e|>:#{pane_width},60},#{=30:pane_title},#{=15:pane_title}}} "

source-file -q ~/.local/share/tacmux/tmux/tacmux-integration.conf
