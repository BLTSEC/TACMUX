# TACMUX integration only. General tmux preferences belong to the operator.

bind-key E display-popup -E -w 92% -h 92% '$HOME/.local/bin/tacmux switch'
bind-key T run-shell -b '$HOME/.local/bin/tacmux _internal log toggle "#{pane_id}"'
bind-key S run-shell -b '$HOME/.local/bin/tacmux _internal log capture "#{pane_id}"'

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tacmux _internal clip'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tacmux _internal clip'

# Auto-log hooks are installed on TACMUX-owned sessions when they start.
