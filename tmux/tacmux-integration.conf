# TACMUX bindings and hooks for an existing tmux configuration.
# This fragment does not change the prefix, shell, mouse, status, or styling.

# Only explicit tmux copy operations may update the terminal clipboard.
set-option -s set-clipboard external

bind-key H run-shell -b '$HOME/.local/share/tacmux/lib/tacmux-logging.sh force "#{pane_id}" fallback'
bind-key q run-shell -b '$HOME/.local/share/tacmux/lib/tacmux-logging.sh stop "#{pane_id}"'
bind-key L display-message 'Logging: #{?pane_pipe,ON,OFF} #{@tacmux_log_file}'
bind-key T run-shell -b '$HOME/.local/share/tacmux/lib/tacmux-logging.sh toggle "#{pane_id}"'
bind-key S run-shell -b '$HOME/.local/share/tacmux/lib/tacmux-logging.sh capture "#{pane_id}"'
bind-key P command-prompt -p 'Pin pane title (empty=unpin):' 'run-shell -b "$HOME/.local/share/tacmux/lib/tacmux-logging.sh retitle \"#{pane_id}\" \"%%\""'

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tacmux clip'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tacmux clip'

# Indexed hooks coexist with user hooks. Command hooks run in the new/current
# pane context, so pane_id is the pane created by split-window/new-window.
set-hook -g after-new-session[90] 'run-shell -b "$HOME/.local/share/tacmux/lib/tacmux-logging.sh start \"#{pane_id}\""'
set-hook -g after-split-window[90] 'run-shell -b "$HOME/.local/share/tacmux/lib/tacmux-logging.sh start \"#{pane_id}\""'
set-hook -g after-new-window[90] 'run-shell -b "$HOME/.local/share/tacmux/lib/tacmux-logging.sh start \"#{pane_id}\""'
set-hook -g pane-title-changed[90] 'run-shell -b "$HOME/.local/share/tacmux/lib/tacmux-pane-guard.sh \"#{hook_pane}\""'
