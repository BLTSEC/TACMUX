# TACMUX bindings and hooks for an existing tmux configuration.
# This fragment does not change the prefix, shell, mouse, status, or styling.

# Only explicit tmux copy operations may update the terminal clipboard.
set-option -s set-clipboard external

bind-key E display-popup -E -w 92% -h 92% '$HOME/.local/bin/tacmux'
bind-key H run-shell -b '$HOME/.local/bin/tacmux _internal log force "#{pane_id}" fallback'
bind-key T run-shell -b '$HOME/.local/bin/tacmux _internal log toggle "#{pane_id}"'
bind-key S run-shell -b '$HOME/.local/bin/tacmux _internal log capture "#{pane_id}"'
bind-key P command-prompt -p 'Pin pane title (empty=unpin):' 'set-option -p @pinned_title "%%%" \; run-shell -b "$HOME/.local/share/tacmux/lib/tacmux-pane-guard.sh \"#{pane_id}\""'

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tacmux _internal clip'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '$HOME/.local/bin/tacmux _internal clip'

# Indexed hooks coexist with user hooks. Command hooks run in the new/current
# pane context, so pane_id is the pane created by split-window/new-window.
set-hook -g after-new-session[90] 'run-shell -b "$HOME/.local/bin/tacmux _internal log start \"#{pane_id}\""'
set-hook -g after-split-window[90] 'run-shell -b "$HOME/.local/bin/tacmux _internal log start \"#{pane_id}\""'
set-hook -g after-new-window[90] 'run-shell -b "$HOME/.local/bin/tacmux _internal log start \"#{pane_id}\""'
set-hook -g pane-title-changed[90] 'run-shell -b "$HOME/.local/share/tacmux/lib/tacmux-pane-guard.sh \"#{hook_pane}\""'
