name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix (for example, 3.0.0)
        required: true
        type: string

concurrency:
  group: tacmux-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y fzf tmux zsh ripgrep

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Validate release tree
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          uv run python scripts/release-preflight.py
          --version "$VERSION"
          --require-head-main
          --notes-output "$RUNNER_TEMP/release-notes.md"

      - name: Check shell syntax
        run: |
          sh -n bin/tacmux
          bash -n install.sh uninstall.sh tests/bin/tmux scripts/public-audit.sh
          zsh -n tests/test_tmux_integration.zsh

      - name: Run release checks
        run: |
          uv run pytest -q
          uv run ruff format --check src tests scripts/release-preflight.py
          uv run ruff check src tests scripts/release-preflight.py
          tests/test_tmux_integration.zsh
          scripts/public-audit.sh

      - name: Refuse an existing version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists" >&2
            exit 1
          fi

      - name: Create verified tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          uv run python scripts/release-preflight.py \
            --version "$VERSION" \
            --require-head-main

          git config user.name "BLTSEC"
          git config user.email "27690059+BLTSEC@users.noreply.github.com"
          git tag -a "v$VERSION" -m "TACMUX $VERSION"
          git push origin "refs/tags/v$VERSION"

          # A merge that landed during the test job must not leave a release
          # pointing behind main. Recheck after the tag push and roll it back
          # before publishing if main advanced in that narrow window.
          git fetch origin main:refs/remotes/origin/main
          if ! uv run python scripts/release-preflight.py \
            --version "$VERSION" \
            --require-head-main; then
            git push --delete origin "v$VERSION"
            exit 1
          fi

          if ! gh release create "v$VERSION" \
            --verify-tag \
            --title "TACMUX $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"; then
            git push --delete origin "v$VERSION"
            exit 1
          fi
