[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "tacmux"
version = "2.4.0"
description = "Operator-first engagement workspaces and tmux control for authorized security assessments"
readme = "README.md"
requires-python = ">=3.11.4"
license = { text = "MIT" }
dependencies = [
  "textual>=8.2,<9",
]

[project.scripts]
tacmux = "tacmux.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14.14,<0.15",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
