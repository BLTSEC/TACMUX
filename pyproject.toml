[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "tacmux"
version = "3.0.0"
description = "Lean tmux-native engagement workspaces for authorized security assessments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tacmux = "tacmux.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14.14,<0.15",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
